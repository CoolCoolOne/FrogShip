ship:
  rotation-speed: 0.03      # Чем меньше это число (например, 0.03), тем плавнее поворот корабля. 
  seat-offset-y: 1.5        # На сколько блоков поднять игрока над базовым сиденьем (0.0=дно блока)
  seat-center-xz: 0.5       # Добавка 0.5 центрирует сиденье внутри блока 1x1

ship-start-delay: 30
ship-yaw-offset: 0.0
ship-route:
  - {x: 300410, y: 64, z: 42223}
  - {x: 300511, y: 64, z: 42224}